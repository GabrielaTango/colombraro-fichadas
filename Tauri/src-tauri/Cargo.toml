[package]
name = "fichadas-tauri"
version = "0.1.0"
description = "Sistema de Fichadas Colombraro"
authors = ["Colombraro"]
edition = "2021"

[lib]
name = "fichadas_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
